<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Test Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e5e7eb;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #020617;
            padding: 24px;
            border-right: 1px solid #1e293b;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 30px;
            color: white;
        }

        .menu {
            display: grid;
            gap: 12px;
        }

        .menu button {
            background: #111827;
            color: #cbd5e1;
            border: 1px solid #1f2937;
            padding: 14px;
            border-radius: 16px;
            text-align: left;
            cursor: pointer;
        }

        .menu button.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .main {
            padding: 28px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }

        .title h1 {
            margin: 0;
            font-size: 28px;
        }

        .title p {
            margin: 6px 0 0;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .card b {
            display: block;
            margin-top: 12px;
            font-size: 30px;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            gap: 12px;
            margin-bottom: 18px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 20px;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid #1e293b;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: #94a3b8;
            font-size: 13px;
            background: #020617;
        }

        tr:hover {
            background: #111827;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: grid;
            place-items: center;
            font-weight: 800;
            flex-shrink: 0;
        }

        .muted {
            color: #94a3b8;
            font-size: 13px;
        }

        .badge {
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .activeBadge {
            background: rgba(34,197,94,.15);
            color: #22c55e;
        }

        .inactiveBadge {
            background: rgba(239,68,68,.15);
            color: #ef4444;
        }

        .expiredBadge {
            background: rgba(245,158,11,.15);
            color: #f59e0b;
        }

        .btn {
            border: 0;
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-dark {
            background: #111827;
            color: white;
            border: 1px solid #334155;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mobile-cards {
            display: none;
        }

        .user-card {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .user-card-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }

        .modal, .login-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .modal.show, .login-modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 520px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 28px;
            padding: 24px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }

        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .main {
                padding: 18px;
            }

            .top {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .title h1 {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .table-wrap {
                display: none;
            }

            .mobile-cards {
                display: block;
            }

            .actions, .modal-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">⚡ Test Bot Admin</div>

        <div class="menu">
            <button class="active">👥 Foydalanuvchilar</button>
            <button>📄 Testlar</button>
            <button>💳 To‘lovlar</button>
            <button>⚙️ Sozlamalar</button>
        </div>
    </aside>

    <main class="main">
        <div class="top">
            <div class="title">
                <h1>Foydalanuvchilar</h1>
                <p>Bot foydalanuvchilarini aktiv / noaktiv qilish</p>
            </div>

            <div class="actions">
                <button class="btn btn-primary" onclick="loadUsers()">🔄 Yangilash</button>
                <button class="btn btn-dark" onclick="logout()">🚪 Chiqish</button>
            </div>
        </div>

        <div class="stats">
            <div class="card">
                <h3>Jami foydalanuvchi</h3>
                <b id="totalUsers">0</b>
            </div>
            <div class="card">
                <h3>Aktiv</h3>
                <b id="activeUsers">0</b>
            </div>
            <div class="card">
                <h3>Noaktiv</h3>
                <b id="inactiveUsers">0</b>
            </div>
            <div class="card">
                <h3>Muddati tugagan</h3>
                <b id="expiredUsers">0</b>
            </div>
        </div>

        <div class="card">
            <div class="filters">
                <input id="searchInput" placeholder="Ism, familiya, telefon yoki username qidirish..." oninput="renderUsers()">

                <select id="statusFilter" onchange="renderUsers()">
                    <option value="ALL">Barchasi</option>
                    <option value="ACTIVE">Aktiv</option>
                    <option value="INACTIVE">Noaktiv</option>
                    <option value="EXPIRED">Muddati tugagan</option>
                </select>

                <select id="sortFilter" onchange="renderUsers()">
                    <option value="new">Yangi birinchi</option>
                    <option value="old">Eski birinchi</option>
                    <option value="name">Ism bo‘yicha</option>
                    <option value="expire">Tugash vaqti</option>
                </select>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>User</th>
                        <th>Telefon</th>
                        <th>Status</th>
                        <th>Aktivlik vaqti</th>
                        <th>Amal</th>
                    </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>

            <div class="mobile-cards" id="mobileUsers"></div>
        </div>
    </main>
</div>

<div class="login-modal show" id="loginModal">
    <div class="modal-box">
        <h2>🔐 Admin kirish</h2>
        <p class="muted">Admin paneldan foydalanish uchun parol kiriting.</p>

        <input type="password" id="adminTokenInput" placeholder="Admin parol">

        <div class="modal-actions">
            <button class="btn btn-primary" onclick="login()">Kirish</button>
        </div>
    </div>
</div>

<div class="modal" id="activateModal">
    <div class="modal-box">
        <h2>Obunani faollashtirish</h2>
        <p class="muted" id="modalUserName"></p>

        <label>Aktiv boshlanish vaqti</label>
        <input type="datetime-local" id="activeFrom">

        <br><br>

        <label>Aktiv tugash vaqti</label>
        <input type="datetime-local" id="activeUntil">

        <div class="modal-actions">
            <button class="btn btn-danger" onclick="closeModal()">Bekor qilish</button>
            <button class="btn btn-primary" onclick="saveActivation()">Saqlash</button>
        </div>
    </div>
</div>

<script>
    let users = [];
    let selectedUserId = null;

    const API_BASE = "/api/admin";
    let ADMIN_TOKEN = localStorage.getItem("ADMIN_TOKEN");

    document.addEventListener("DOMContentLoaded", () => {
        if (ADMIN_TOKEN) {
            document.getElementById("loginModal").classList.remove("show");
            loadUsers();
        }
    });

    function getHeaders(json = false) {
        const headers = {
            "X-ADMIN-TOKEN": ADMIN_TOKEN
        };

        if (json) {
            headers["Content-Type"] = "application/json";
        }

        return headers;
    }

    function login() {
        const token = document.getElementById("adminTokenInput").value.trim();

        if (!token) {
            alert("Parol kiriting");
            return;
        }

        ADMIN_TOKEN = token;
        localStorage.setItem("ADMIN_TOKEN", token);
        document.getElementById("loginModal").classList.remove("show");
        loadUsers();
    }

    function logout() {
        localStorage.removeItem("ADMIN_TOKEN");
        ADMIN_TOKEN = null;
        document.getElementById("loginModal").classList.add("show");
    }

    async function loadUsers() {
        try {
            const res = await fetch(`${API_BASE}/users`, {
                headers: getHeaders()
            });

            if (!res.ok) {
                localStorage.removeItem("ADMIN_TOKEN");
                document.getElementById("loginModal").classList.add("show");
                alert("Admin parol noto‘g‘ri yoki backend ruxsat bermadi");
                return;
            }

            users = await res.json();
            renderUsers();

        } catch (e) {
            alert("Backend bilan aloqa yo‘q");
            console.error(e);
        }
    }

    function isExpired(user) {
        if (!user.activeUntil) return false;
        return new Date(user.activeUntil).getTime() < Date.now();
    }

    function realActive(user) {
        return user.active && !isExpired(user);
    }

    function renderUsers() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const status = document.getElementById("statusFilter").value;
        const sort = document.getElementById("sortFilter").value;

        let filtered = users.filter(u => {
            const full = `${u.firstName || ""} ${u.lastName || ""} ${u.username || ""} ${u.phoneNumber || ""}`.toLowerCase();

            const matchSearch = full.includes(search);
            const matchStatus =
                status === "ALL" ||
                (status === "ACTIVE" && realActive(u)) ||
                (status === "INACTIVE" && !realActive(u)) ||
                (status === "EXPIRED" && isExpired(u));

            return matchSearch && matchStatus;
        });

        if (sort === "new") filtered.sort((a, b) => b.id - a.id);
        if (sort === "old") filtered.sort((a, b) => a.id - b.id);
        if (sort === "name") filtered.sort((a, b) => `${a.firstName}`.localeCompare(`${b.firstName}`));
        if (sort === "expire") filtered.sort((a, b) => new Date(a.activeUntil || 0) - new Date(b.activeUntil || 0));

        document.getElementById("totalUsers").textContent = users.length;
        document.getElementById("activeUsers").textContent = users.filter(realActive).length;
        document.getElementById("inactiveUsers").textContent = users.filter(u => !realActive(u)).length;
        document.getElementById("expiredUsers").textContent = users.filter(isExpired).length;

        const tbody = document.getElementById("usersTable");
        const mobile = document.getElementById("mobileUsers");

        tbody.innerHTML = "";
        mobile.innerHTML = "";

        filtered.forEach(user => {
            tbody.innerHTML += renderTableRow(user);
            mobile.innerHTML += renderMobileCard(user);
        });
    }

    function statusBadge(user) {
        if (isExpired(user)) {
            return `<span class="badge expiredBadge">EXPIRED</span>`;
        }

        if (realActive(user)) {
            return `<span class="badge activeBadge">ACTIVE</span>`;
        }

        return `<span class="badge inactiveBadge">INACTIVE</span>`;
    }

    function renderTableRow(user) {
        const initials = `${user.firstName || "U"}`.charAt(0).toUpperCase();

        return `
            <tr>
                <td>
                    <div class="user">
                        <div class="avatar">${initials}</div>
                        <div>
                            <b>${user.firstName || "-"} ${user.lastName || ""}</b>
                            <div class="muted">@${user.username || "username yo‘q"}</div>
                            <div class="muted">Chat ID: ${user.chatId || "-"}</div>
                        </div>
                    </div>
                </td>
                <td>${user.phoneNumber || "-"}</td>
                <td>${statusBadge(user)}</td>
                <td>
                    <div class="muted">Boshlanish: ${formatDate(user.activeFrom)}</div>
                    <div class="muted">Tugash: ${formatDate(user.activeUntil)}</div>
                </td>
                <td>
                    <div class="row-actions">
                        <button class="btn btn-primary" onclick="openActivateModal(${user.id})">Aktiv qilish</button>
                        <button class="btn btn-danger" onclick="deactivateUser(${user.id})">O‘chirish</button>
                    </div>
                </td>
            </tr>
        `;
    }

    function renderMobileCard(user) {
        const initials = `${user.firstName || "U"}`.charAt(0).toUpperCase();

        return `
            <div class="user-card">
                <div class="user-card-top">
                    <div class="user">
                        <div class="avatar">${initials}</div>
                        <div>
                            <b>${user.firstName || "-"} ${user.lastName || ""}</b>
                            <div class="muted">@${user.username || "username yo‘q"}</div>
                        </div>
                    </div>
                    ${statusBadge(user)}
                </div>

                <div class="muted">📞 ${user.phoneNumber || "-"}</div>
                <div class="muted">🆔 Chat ID: ${user.chatId || "-"}</div>
                <br>
                <div class="muted">Boshlanish: ${formatDate(user.activeFrom)}</div>
                <div class="muted">Tugash: ${formatDate(user.activeUntil)}</div>

                <br>
                <button class="btn btn-primary" onclick="openActivateModal(${user.id})">Aktiv qilish</button>
                <br><br>
                <button class="btn btn-danger" onclick="deactivateUser(${user.id})">O‘chirish</button>
            </div>
        `;
    }

    function openActivateModal(userId) {
        selectedUserId = userId;

        const user = users.find(u => u.id === userId);
        document.getElementById("modalUserName").textContent =
            `${user.firstName || ""} ${user.lastName || ""} | ${user.phoneNumber || ""}`;

        const now = new Date();
        const oneMonth = new Date();
        oneMonth.setMonth(oneMonth.getMonth() + 1);

        document.getElementById("activeFrom").value = toLocalDateTime(now);
        document.getElementById("activeUntil").value = toLocalDateTime(oneMonth);

        document.getElementById("activateModal").classList.add("show");
    }

    function closeModal() {
        document.getElementById("activateModal").classList.remove("show");
        selectedUserId = null;
    }

    async function saveActivation() {
        const activeFrom = document.getElementById("activeFrom").value;
        const activeUntil = document.getElementById("activeUntil").value;

        if (!activeFrom || !activeUntil) {
            alert("Vaqtlarni kiriting");
            return;
        }

        await fetch(`${API_BASE}/users/${selectedUserId}/activate`, {
            method: "PUT",
            headers: getHeaders(true),
            body: JSON.stringify({
                active: true,
                activeFrom,
                activeUntil
            })
        });

        closeModal();
        await loadUsers();
    }

    async function deactivateUser(userId) {
        if (!confirm("Userni noaktiv qilasizmi?")) return;

        await fetch(`${API_BASE}/users/${userId}/deactivate`, {
            method: "PUT",
            headers: getHeaders()
        });

        await loadUsers();
    }

    function formatDate(value) {
        if (!value) return "-";
        return value.replace("T", " ").substring(0, 16);
    }

    function toLocalDateTime(date) {
        const pad = n => String(n).padStart(2, "0");

        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }
</script>

</body>
</html>
